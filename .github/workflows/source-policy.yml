name: Source policy
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    uses: agents-tools/github-workflows/.github/workflows/policy.yml@0000000000000000000000000000000000000000
    with:
      allow-terms: |
        ChatGPT
        Claude
        Codex
        Cursor
      dependabot-exception: true
